<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>UMD Observatory</title>
  <link rel="stylesheet" href="/console/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-orbit">◉</span><div><strong>UMD</strong><small>OBSERVATORY 3.9</small></div></div>
      <nav id="navigation">
        <button class="nav active" data-page="overview"><span>⌂</span>宇宙总览</button>
        <button class="nav" data-page="memories"><span>◌</span>记忆轨道</button>
        <button class="nav" data-page="retrieval"><span>⌁</span>引力调试</button>
        <button class="nav" data-page="graph"><span>◎</span>星图关系</button>
        <button class="nav" data-page="entities"><span>◇</span>实体身份</button>
        <button class="nav" data-page="audit"><span>≋</span>审计日志</button>
      </nav>
      <div class="sidebar-foot">
        <div class="status-line"><i id="healthDot"></i><span id="healthText">未连接</span></div>
        <button id="disconnect" class="quiet">更换连接</button>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div><p class="eyebrow" id="pageEyebrow">SYSTEM MAP</p><h1 id="pageTitle">宇宙总览</h1></div>
        <div class="top-actions"><span id="revisionBadge" class="badge">REV —</span><button id="refresh" class="icon-btn" title="刷新">↻</button></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="connectModal" class="modal open">
    <form id="connectForm" class="connect-card">
      <div class="connect-mark">◉</div>
      <p class="eyebrow">UMD TELESCOPE LINK</p>
      <h2>连接你的记忆宇宙</h2>
      <p class="muted">密钥仅保存在本次浏览器会话中。</p>
      <label>服务地址<input id="endpoint" value="" placeholder="http://127.0.0.1:8765"></label>
      <label>API Key<input id="apiKey" type="password" autocomplete="off" placeholder="umd_key_..."></label>
      <button class="primary" type="submit">建立观测链路</button>
      <p id="connectError" class="error"></p>
    </form>
  </div>
  <div id="toast" class="toast"></div>
  <dialog id="memoryDialog">
    <form id="memoryForm" class="connect-card" method="dialog">
      <p class="eyebrow">NEW PLANETARY MEMORY</p><h2>写入记忆轨道</h2>
      <label>记忆内容<textarea id="newText" required maxlength="20000" placeholder="输入需要长期保存的事实、偏好或事件……"></textarea></label>
      <div class="form-pair"><label>作用域<input id="newScope" placeholder="project-atlas"></label><label>重要度<input id="newImportance" type="number" min="0" max="1" step="0.1" value="0.7"></label></div>
      <label>标签<input id="newTags" placeholder="engineering, preference"></label>
      <div class="dialog-actions"><button id="cancelMemory" type="button" class="quiet">取消</button><button class="primary" type="submit">封装引力舱</button></div>
      <p id="memoryError" class="error"></p>
    </form>
  </dialog>
  <script type="module" src="/console/app.js"></script>
</body>
</html>
